name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run aplomo eval --json
      - run: uv run python -m compileall -q src tests
      - run: uv build

  packaged-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      - name: Install the wheel and exercise a clean repository
        run: |
          uv tool install dist/*.whl
          repo="$(mktemp -d)"
          git -C "$repo" init -q
          aplomo init --root "$repo" --agents cursor codex claude
          aplomo doctor --root "$repo"
          test -f "$repo/.agents/skills/aplomo-review/SKILL.md"
          test -f "$repo/.agents/skills/aplomo-review/references/architecture.md"
          test ! -e "$repo/.codex/config.toml"
          aplomo prepare "Find a reusable retry policy" --query RetryPolicy --root "$repo"
