name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run aplomo eval --json
      - run: uv run python -m compileall -q src tests
      - run: uv build

  packaged-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      - name: Install the wheel and exercise a clean repository
        run: |
          uv tool install dist/*.whl
          repo="$(mktemp -d)"
          git -C "$repo" init -q
          aplomo init --root "$repo" --agents cursor codex claude
          aplomo doctor --root "$repo"
