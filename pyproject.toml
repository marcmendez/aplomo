[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aplomo"
version = "1.1.0"
description = "Reuse repository patterns and stop duplicate abstractions across coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Aplomo contributors" }]
keywords = ["coding-agents", "mcp", "developer-tools", "architecture"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/marcmendez/aplomo"
Documentation = "https://github.com/marcmendez/aplomo#readme"
Issues = "https://github.com/marcmendez/aplomo/issues"
Source = "https://github.com/marcmendez/aplomo"

[project.scripts]
aplomo = "engineering_harness.cli:main"
# Compatibility alias for repositories initialized by the early MVP.
eng = "engineering_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
