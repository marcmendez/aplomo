[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aplomo"
version = "0.1.0"
description = "One repository engineering standard for Cursor, Codex, and Claude Code"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aplomo contributors" }]
keywords = ["coding-agents", "mcp", "developer-tools", "architecture"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
aplomo = "engineering_harness.cli:main"
# Compatibility alias for repositories initialized by the early MVP.
eng = "engineering_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
